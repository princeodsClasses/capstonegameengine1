<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>게임 엔진 캡스톤 — Course Outline</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-1: #bdeaff;
    --sky-2: #eaf9ff;
    --grass: #6bc55a;
    --blue: #1f9be0;
    --blue-dark: #0f7fc2;
    --yellow: #ffce3d;
    --yellow-dark: #f2a900;
    --pink: #ff6fae;
    --green: #3ddc6a;
    --green-dark: #1fb852;
    --ink: #1b2b3a;
    --ink-soft: #3a5266;
    --ink-faint: rgba(27,43,58,.45);
    --white: #ffffff;
    --dash: rgba(27,43,58,.20);
    --card-shadow: 0 4px 0 rgba(0,0,0,.08);
    --card-shadow-lg: 0 8px 0 rgba(0,0,0,.10), 0 16px 28px rgba(0,0,0,.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0; background:var(--sky-2);}
  body{
    font-family:'Nunito',sans-serif; color:var(--ink);
    background:linear-gradient(180deg, var(--sky-1) 0%, var(--sky-2) 40%, #eafce0 100%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .display{font-family:'Baloo 2',sans-serif;}

  /* floating clouds */
  .cloud{ position:fixed; background:#fff; border-radius:50%; opacity:.55; z-index:0;
    animation: drift 16s ease-in-out infinite alternate; pointer-events:none; }
  @keyframes drift{ from{transform:translateX(0);} to{transform:translateX(60px);} }

  .wrap{ position:relative; z-index:1; max-width:1100px; margin:0 auto; padding:64px 32px 100px; }

  /* ---------- Hero ---------- */
  .hero{ text-align:center; margin-bottom:64px; }
  .pill-tag{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--yellow); color:var(--ink);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    padding:8px 20px; border-radius:999px;
    box-shadow:0 4px 0 var(--yellow-dark);
    margin-bottom:26px;
  }
  .hero h1{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:64px; line-height:1.08;
    color:var(--white); margin:0 0 18px;
    -webkit-text-stroke:6px var(--ink); paint-order:stroke fill;
    filter:drop-shadow(0 6px 0 rgba(0,0,0,.15));
    letter-spacing:-1px;
  }
  .hero p{
    font-size:17px; color:var(--ink-soft); line-height:1.7; max-width:560px;
    margin:0 auto; font-weight:600;
  }
  .hero-meta{ display:flex; justify-content:center; gap:12px; margin-top:30px; flex-wrap:wrap; }
  .meta-chip{ background:var(--white); border-radius:16px; padding:11px 18px; box-shadow:var(--card-shadow); min-width:100px; }
  .meta-chip .k{ font-family:'Nunito',sans-serif; font-weight:800; font-size:10px; letter-spacing:.8px; color:var(--ink-soft); opacity:.65; text-transform:uppercase; }
  .meta-chip .v{ font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--ink); margin-top:3px; }

  /* ---------- Section title ---------- */
  .section-eyebrow{
    display:flex; align-items:center; gap:8px; justify-content:center;
    font-family:'Nunito',sans-serif; font-weight:800; font-size:13px; letter-spacing:1px;
    color:var(--blue-dark); margin-bottom:10px;
  }
  .section-title{
    font-family:'Baloo 2',sans-serif; font-size:30px; font-weight:700;
    color:var(--ink); text-align:center; margin:0 0 44px;
  }
  .section-title .emph{
    color:var(--blue-dark);
    background:linear-gradient(180deg, transparent 58%, rgba(255,206,61,.6) 58%);
    padding:0 4px;
  }

  /* ---------- Week grid ---------- */
  .week-grid{
    display:grid; grid-template-columns:repeat(3, 1fr); gap:20px;
  }
  .week-card{
    display:flex; flex-direction:column; gap:10px;
    background:var(--white); border-radius:20px; padding:24px 24px 22px;
    box-shadow:var(--card-shadow); text-decoration:none; color:inherit;
    transition:transform .18s ease, box-shadow .18s ease;
    border:2px solid transparent;
    position:relative;
    overflow:hidden;
  }
  .week-card:hover{
    transform:translateY(-4px);
    box-shadow:var(--card-shadow-lg);
    border-color:var(--blue);
  }
  .week-num{
    font-family:'Baloo 2',sans-serif; font-weight:800; font-size:13px;
    color:var(--white); background:linear-gradient(180deg,var(--blue),var(--blue-dark));
    display:inline-flex; align-items:center; justify-content:center;
    width:auto; padding:6px 14px; border-radius:999px; box-shadow:0 3px 0 var(--blue-dark);
    align-self:flex-start; letter-spacing:.5px;
  }
  .week-title{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:18px; color:var(--ink);
    margin-top:4px;
  }
  .week-sub{
    font-size:12.5px; color:var(--ink-faint); font-weight:700; letter-spacing:.3px;
  }
  .week-arrow{
    position:absolute; right:20px; bottom:20px;
    width:32px; height:32px; border-radius:50%;
    background:#eaf6ff; color:var(--blue-dark);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:15px;
    transition:background .18s ease, color .18s ease;
  }
  .week-card:hover .week-arrow{ background:var(--yellow); color:var(--ink); }

  .week-card.milestone{
    background:linear-gradient(180deg,#fff7e6,#fff);
    border-color:rgba(242,169,0,.35);
  }
  .week-card.milestone .week-num{
    background:linear-gradient(180deg,var(--yellow),var(--yellow-dark)); box-shadow:0 3px 0 #b9820a; color:var(--ink);
  }

  footer{
    position:relative; z-index:1; text-align:center; padding:40px 24px 60px;
    font-size:12px; color:var(--ink-faint); font-weight:700; letter-spacing:.3px;
  }

  /* ---------- Coming soon popup ---------- */
  .popup-overlay{
    position:fixed; inset:0; z-index:100;
    background:rgba(27,43,58,.45);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .popup-overlay.show{ opacity:1; pointer-events:auto; }
  .popup-card{
    background:var(--white); border-radius:24px; padding:36px 40px;
    box-shadow:var(--card-shadow-lg); text-align:center; max-width:300px;
    transform:scale(.9); transition:transform .2s ease;
  }
  .popup-overlay.show .popup-card{ transform:scale(1); }
  .popup-emoji{ font-size:38px; margin-bottom:12px; }
  .popup-text{
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:17px;
    color:var(--ink); margin-bottom:22px; line-height:1.4;
  }
  .popup-btn{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--yellow); color:var(--ink);
    font-family:'Baloo 2',sans-serif; font-weight:700; font-size:14px;
    padding:10px 30px; border-radius:999px; box-shadow:0 4px 0 var(--yellow-dark);
    border:none; cursor:pointer;
  }

  @media screen and (max-width:860px){
    .week-grid{ grid-template-columns:repeat(2, 1fr); }
    .hero h1{ font-size:44px; -webkit-text-stroke:4px var(--ink); }
  }
  @media screen and (max-width:560px){
    .week-grid{ grid-template-columns:1fr; }
    .wrap{ padding:48px 20px 80px; }
  }
</style>
</head>
<body>

<div class="cloud" style="width:120px;height:66px; top:60px; left:6%;"></div>
<div class="cloud" style="width:160px;height:88px; top:120px; right:8%; animation-delay:-6s;"></div>

<div class="wrap">

  <div class="hero">
    <div class="pill-tag">🎮 DIGITAL CONTENTS DESIGN</div><!--CAPSTONE · GAME ENGINE</div>-->
    <h1 class="display">CAPSTONE<br>GAME ENGINE</h1>
    <!--p>게임 엔진을 다루며 한 학기 동안 나만의 게임을 완성해가는 과정입니다.</p>
    <div class="hero-meta">
      <div class="meta-chip"><div class="k">Weeks</div><div class="v">01 – 15</div></div>
      <div class="meta-chip"><div class="k">Track</div><div class="v">Digital Contents Design</div></div>
      <div class="meta-chip"><div class="k">Level</div><div class="v">3학년 / 캡스톤</div></div>
    </div-->
  </div>

  <div class="section-eyebrow">WEEKLY MATERIALS</div>
  <h2 class="section-title">한 주씩, <span class="emph">차근차근</span> 달려봅시다</h2>

  <div class="week-grid" id="weekGrid">
    <a class="week-card milestone" href="orientation.html">
      <span class="week-num">ORIENTATION</span>
      <div class="week-title">오리엔테이션</div>
      <!--div class="week-sub">준비중</div-->
      <span class="week-arrow">→</span>
    </a>
  </div>

</div>

<footer>Game Engine Capstone · Digital Contents Design</footer>

<div class="popup-overlay" id="popupOverlay">
  <div class="popup-card">
    <div class="popup-emoji">🚧</div>
    <div class="popup-text">아직 준비 중이에요..!</div>
    <button class="popup-btn" id="popupClose">확인</button>
  </div>
</div>

<script>
  // class01.html 처럼 실제로 페이지가 만들어진 주차만 여기에 추가하면 카드가 바로 열립니다.
  const READY_WEEKS = [2];

  const weeks = Array.from({length: 14}, (_, i) => i + 2);
  const grid = document.getElementById('weekGrid');
  const popupOverlay = document.getElementById('popupOverlay');

  const showComingSoon = () => popupOverlay.classList.add('show');
  const hideComingSoon = () => popupOverlay.classList.remove('show');
  document.getElementById('popupClose').addEventListener('click', hideComingSoon);
  popupOverlay.addEventListener('click', (e) => { if (e.target === popupOverlay) hideComingSoon(); });

  weeks.forEach(n => {
    const num = String(n).padStart(2, '0');
    const ready = READY_WEEKS.includes(n);
    const a = document.createElement('a');
    a.className = 'week-card' + (n === 15 ? ' milestone' : '');
    a.href = ready ? `class${num}.html` : '#';
    if (!ready) a.addEventListener('click', (e) => { e.preventDefault(); showComingSoon(); });
    a.innerHTML = `
      <span class="week-num">WEEK ${num}</span>
      <div class="week-title">${n}주차</div>
      <div class="week-sub">${ready ? '' : '준비중'}</div>
      <span class="week-arrow">→</span>
    `;
    grid.appendChild(a);
  });
</script>

</body>
</html>
